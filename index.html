          <div className="calc-result-row"><span className="calc-result-label">Custo ônibus</span><span className="calc-result-value">{R$(r.custoOnibus)}</span></div>
          <div className="calc-result-row"><span className="calc-result-label">Custo hotel</span><span className="calc-result-value">{R$(r.custoHotel)}</span></div>
          <div className="calc-result-row"><span className="calc-result-label">Custo total</span><span className="calc-result-value">{R$(r.custoTotal)}</span></div>
          <div className="calc-result-row"><span className="calc-result-label">Custo por passageiro</span><span className="calc-result-value">{R$(r.custoPorPax)}</span></div>
          <div className="calc-result-row"><span className="calc-result-label">Lucro total</span><span className="calc-result-profit">{R$(r.lucro)}</span></div>
          <div className="calc-result-row"><span className="calc-result-label">Lucro por passageiro</span><span className="calc-result-value">{R$(r.lucroPorPax)}</span></div>
          <div className="calc-result-row" style={{marginTop:8,paddingTop:4}}><span style={{fontSize:15,fontWeight:800,color:"var(--txt)"}}>Valor por passageiro</span><span className="calc-result-highlight">{R$(r.valorPorPax)}</span></div>
          <div className="calc-result-row"><span style={{fontSize:15,fontWeight:800,color:"var(--txt)"}}>Valor total da viagem</span><span className="calc-result-highlight">{R$(r.valorFinal)}</span></div>
        </div>
      )}
    </>
  );
}

function gerarPDFCalc(resultado, onibus, hoteis, nomeViagem) {
  const r = resultado;
  const fmt = v => `R$ ${Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2})}`;
  const linhasOnibus = onibus.map(o=>`<tr><td style="padding:8px">${o.nome}</td><td style="padding:8px;text-align:right">${fmt(o.valor||0)}</td></tr>`).join("");
  const linhasHotel = hoteis.map(h=>`<tr><td style="padding:8px">${h.nome}</td><td style="padding:8px;text-align:right">${fmt(h.valor||0)}</td></tr>`).join("");
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><title>Orçamento${nomeViagem?" — "+nomeViagem:""}</title><style>body{font-family:Arial,sans-serif;color:#111;padding:32px;max-width:700px;margin:0 auto}h1{font-size:22px;margin-bottom:4px}.sub{color:#555;font-size:13px;margin-bottom:24px}h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#374151;border-bottom:2px solid #e5e7eb;padding-bottom:6px;margin:20px 0 10px}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#1e293b;color:#fff;padding:8px;text-align:left}th:last-child,td:last-child{text-align:right}.res{background:#f8fafc;border-radius:8px;padding:16px;margin-top:20px}.res-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e5e7eb;font-size:13px}.res-row:last-child{border-bottom:none}.dest{font-size:18px;font-weight:700;color:#0369a1}.dest2{font-size:22px;font-weight:700;color:#0369a1}@media print{body{padding:16px}}</style></head><body><h1>Orçamento de Viagem${nomeViagem?" — "+nomeViagem:""}</h1><div class="sub">Gerado em ${new Date().toLocaleDateString("pt-BR")}</div><h2>Ônibus</h2><table><thead><tr><th>Descrição</th><th style="text-align:right">Valor</th></tr></thead><tbody>${linhasOnibus}<tr style="background:#f1f5f9"><td style="padding:8px;font-weight:700">Subtotal Ônibus</td><td style="padding:8px;text-align:right;font-weight:700">${fmt(r.custoOnibus)}</td></tr></tbody></table><h2>Hotéis</h2><table><thead><tr><th>Descrição</th><th style="text-align:right">Valor</th></tr></thead><tbody>${linhasHotel}<tr style="background:#f1f5f9"><td style="padding:8px;font-weight:700">Subtotal Hotéis</td><td style="padding:8px;text-align:right;font-weight:700">${fmt(r.custoHotel)}</td></tr></tbody></table><div class="res"><div class="res-row"><span>Custo Total</span><span>${fmt(r.custoTotal)}</span></div><div class="res-row"><span>Nº de Passageiros</span><span>${r.nPax}</span></div><div class="res-row"><span>Custo por Passageiro</span><span>${fmt(r.custoPorPax)}</span></div><div class="res-row"><span>Lucro Total</span><span style="color:#16a34a">${fmt(r.lucro)}</span></div><div class="res-row"><span>Lucro por Passageiro</span><span style="color:#16a34a">${fmt(r.lucroPorPax)}</span></div><div class="res-row" style="margin-top:8px"><span style="font-size:15px;font-weight:700">Valor por Passageiro</span><span class="dest">${fmt(r.valorPorPax)}</span></div><div class="res-row"><span style="font-size:15px;font-weight:700">Valor Total da Viagem</span><span class="dest2">${fmt(r.valorFinal)}</span></div></div></body></html>`;
  const win=window.open("","_blank");
  if(!win)return alert("Permita pop-ups para gerar o PDF");
  win.document.write(html);win.document.close();setTimeout(()=>win.print(),600);
}

// ── CALCULADORA (aba principal) ───────────────────────────────────────────────
function Calculadora() {
  const state = useCalc();
  const {resultado, dados} = state;
  const r = resultado;
  return (
    <div className="ani">
      <div className="topbar"><h1>Calculadora</h1></div>
      <div className="calc-section">
        <CalcForm state={state}/>
        {r.custoTotal>0 && r.nPax>0 && (
          <button className="btn btn-primary btn-full" style={{marginTop:4,marginBottom:24}}
            onClick={()=>gerarPDFCalc(r, dados.onibus, dados.hoteis, "Simulação")}>
            <>{ICONS.pdf} Gerar PDF do Orçamento</>
          </button>
        )}
      </div>
    </div>
  );
}

// ── TAB ORÇAMENTO (dentro da viagem) ─────────────────────────────────────────
function TabOrcamento({viagem, updViagem}) {
  const orcSalvo = viagem.orcamento || null;
  const state = useCalc(orcSalvo);
  const {resultado, dados} = state;
  const r = resultado;
  const [salvando, setSalvando] = React.useState(false);
  const [salvo, setSalvo] = React.useState(false);

  const salvar = async () => {
    setSalvando(true);
    await updViagem({...viagem, orcamento: dados});
    setSalvando(false); setSalvo(true);
    setTimeout(()=>setSalvo(false), 2000);
  };

  return (
    <div style={{padding:"0 0 24px"}}>
      <div style={{padding:"14px 28px 0",display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <span style={{fontSize:12,color:"var(--dim)"}}>Orçamento vinculado a <strong style={{color:"var(--txt)"}}>{viagem.nome}</strong></span>
        <div style={{display:"flex",gap:8}}>
          {r.custoTotal>0&&r.nPax>0&&<button className="btn btn-ghost btn-sm" onClick={()=>gerarPDFCalc(r,dados.onibus,dados.hoteis,viagem.nome)}>📄 PDF</button>}
          <button className="btn btn-primary btn-sm" onClick={salvar} disabled={salvando}>
            {salvando?"Salvando...":salvo?"Salvo ✓":<>{ICONS.save} Salvar</>}
          </button>
        </div>
      </div>
      <div className="calc-section" style={{paddingTop:10}}>
        <CalcForm state={state}/>
      </div>
    </div>
  );
}



// ── COBRANÇAS ─────────────────────────────────────────────────────────────────
const PIX_KEY = "58342611000106";
const PIX_DISPLAY = "58.342.611/0001-06";

const SC = {
  pendente:  {l:"Pendente",  c:"var(--amber)"},
  cobrado:   {l:"Cobrado",   c:"var(--sky)"},
  prometido: {l:"Prometido", c:"var(--lilac)"},
  quitado:   {l:"Quitado",  c:"var(--mint)"},
};

const MODELO_PADRAO = `Olá {nome},

Passando para avisar que ainda temos em aberto o seguinte para a viagem *{viagem}*:

{itens}

Nossa chave Pix: *{pix}*

Aguardamos o envio do valor restante ou parte dele para podermos registrar aqui. Caso queira, podemos combinar uma data para te lembrarmos sobre o valor.

Quando fizer o pagamento, por gentileza envie o comprovante.

V&V Viagens agradece! 🙏`;

function formatFone(fone) {
  if(!fone) return "";
  return "55" + fone.replace(/\D/g,"");
}

function gerarMensagem(modelo, nomeResp, nomeViagem, itens) {
  const itensStr = itens.map(i=>`• ${i.nome}: *${R$(i.falta)}* em aberto`).join("\n");
  return modelo
    .replace(/\{nome\}/g, nomeResp||"cliente")
    .replace(/\{viagem\}/g, nomeViagem)
    .replace(/\{itens\}/g, itensStr)
    .replace(/\{pix\}/g, PIX_DISPLAY);
}

function Cobrancas({viagens, updViagem}) {
  const [vid, setVid] = useState("");
  const [filtro, setFiltro] = useState("todos");
  const [modelo, setModelo] = useState(MODELO_PADRAO);
  const [editModelo, setEditModelo] = useState(false);
  const [modeloTemp, setModeloTemp] = useState(MODELO_PADRAO);
  const [sel, setSel] = useState(null); // grupo selecionado
  const [msgEdit, setMsgEdit] = useState(""); // mensagem editável pontual

  const viagem = viagens.find(v=>v.id===vid);
  const reservas = viagem?.reservas||[];

  // Agrupar por telefone do responsável
  const grupos = React.useMemo(()=>{
    const mapa = {};
    reservas.forEach(r=>{
      const falta = Number(viagem?.valor||0) - sumPgto(r);
      if(falta<=0) return; // já quitado
      const fone = r.telefoneResp||r.passageiroTel||"sem-telefone";
      const resp = r.responsavel||r.nomeAvulso||"Sem responsável";
      const key = fone+"|"+resp;
      if(!mapa[key]) mapa[key] = {resp, fone, paxs:[], ultimaCob:null, statusCob:r.statusCobranca||"pendente"};
      mapa[key].paxs.push({id:r.id, nome:r.nomeAvulso, falta, statusCobranca:r.statusCobranca||"pendente", ultimaCob:r.ultimaCobranca, dataPrometida:r.dataPrometida});
      if(r.ultimaCobranca && (!mapa[key].ultimaCob || r.ultimaCobranca > mapa[key].ultimaCob)) mapa[key].ultimaCob = r.ultimaCobranca;
    });
    return Object.values(mapa);
  }, [reservas, viagem]);

  const hoje = new Date().toISOString().slice(0,10);
  const gruposFiltrados = grupos.filter(g=>{
    if(filtro==="nunca") return !g.ultimaCob;
    if(filtro==="prometido") return g.paxs.some(p=>p.statusCobranca==="prometido" && p.dataPrometida && p.dataPrometida < hoje);
    if(filtro==="cobrado") return g.ultimaCob;
    return true;
  });

  const abrirGrupo = (g) => {
    setSel(g);
    const msg = gerarMensagem(modelo, g.resp, viagem?.nome||"", g.paxs);
    setMsgEdit(msg);
  };

  const registrarCobranca = async (g) => {
    const agora = new Date().toISOString();
    const novasReservas = reservas.map(r=>{
      const pertence = g.paxs.some(p=>p.id===r.id);
      if(pertence) return {...r, statusCobranca:"cobrado", ultimaCobranca:agora};
      return r;
    });
    await updViagem({...viagem, reservas:novasReservas});
    setSel(null);
  };

  const abrirWhatsApp = (fone, msg) => {
    const num = formatFone(fone);
    if(!num || num.length < 12) return alert("Número de WhatsApp inválido ou não cadastrado.");
    const url = `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
    window.open(url,"_blank");
  };

  return (
    <div className="ani">
      <div className="topbar"><h1>Cobranças</h1></div>

      {/* Seleção de viagem */}
      <div className="cob-viagem-sel">
        <div className="fg">
          <label className="fl">Selecione a Viagem</label>
          <select className="fsel" value={vid} onChange={e=>{setVid(e.target.value);setSel(null);}}>
            <option value="">Selecionar viagem...</option>
            {viagens.map(v=><option key={v.id} value={v.id}>{v.nome} — {dt(v.dataIda)}</option>)}
          </select>
        </div>
        {vid&&<div className="cob-filter">
          {[["todos","Todos"],["nunca","Nunca cobrados"],["cobrado","Já cobrados"],["prometido","Prometidos atrasados"]].map(([id,lb])=>(
            <div key={id} className={`cob-filter-btn ${filtro===id?"on":""}`} onClick={()=>setFiltro(id)}>{lb}</div>
          ))}
        </div>}
      </div>

      {/* Modelo de mensagem */}
      {vid&&<div className="cob-modelo">
        <div className="cob-modelo-title">
          <span>Modelo de Mensagem</span>
          <button className="btn btn-ghost btn-sm" onClick={()=>{setModeloTemp(modelo);setEditModelo(!editModelo);}}>
            {editModelo?"Cancelar":ICONS.edit}
          </button>
        </div>
        {editModelo?(
          <>
            <div style={{fontSize:11,color:"var(--dim2)",marginBottom:8,lineHeight:1.6}}>
              Variáveis disponíveis: <code style={{color:"var(--sky)"}}>{"{nome}"}</code> · <code style={{color:"var(--sky)"}}>{"{viagem}"}</code> · <code style={{color:"var(--sky)"}}>{"{itens}"}</code> · <code style={{color:"var(--sky)"}}>{"{pix}"}</code>
            </div>
            <textarea className="cob-msg-area" rows={10} value={modeloTemp} onChange={e=>setModeloTemp(e.target.value)}/>
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>setEditModelo(false)}>Cancelar</button>
              <button className="btn btn-primary btn-sm" onClick={()=>{setModelo(modeloTemp);setEditModelo(false);}}>Salvar Modelo</button>
            </div>
          </>
        ):(
          <div style={{fontSize:12,color:"var(--dim2)",whiteSpace:"pre-wrap",lineHeight:1.6,maxHeight:80,overflow:"hidden",maskImage:"linear-gradient(to bottom,black 60%,transparent)"}}>{modelo}</div>
        )}
      </div>}

      {/* Lista de pendentes */}
      {vid&&(
        <div className="cob-lista">
          <div style={{fontSize:10,fontWeight:600,color:"var(--dim2)",textTransform:"uppercase",letterSpacing:".6px",marginBottom:10}}>
            {gruposFiltrados.length} responsável(is) com pendências
          </div>
          {gruposFiltrados.length===0
            ?<div className="empty"><div className="empty-icon">{ICONS.check}</div><p>Nenhum pendente nesse filtro</p></div>
            :gruposFiltrados.map((g,i)=>{
              const totalFalta = g.paxs.reduce((s,p)=>s+p.falta,0);
              const sc = SC[g.paxs[0]?.statusCobranca]||SC.pendente;
              return (
                <div key={i} className="cob-group">
                  <div className="cob-group-header" onClick={()=>abrirGrupo(g)}>
                    <div style={{flex:1}}>
                      <div className="cob-group-name">{g.resp}</div>
                      <div className="cob-group-phone">{g.fone!=="sem-telefone"?g.fone:"Sem telefone cadastrado"}</div>
                      {g.ultimaCob&&<div className="cob-hist">Último contato: {new Date(g.ultimaCob).toLocaleDateString("pt-BR")}</div>}
                    </div>
                    <div style={{textAlign:"right"}}>
                      <div className="cob-group-total">{R$(totalFalta)}</div>
                      <span className="cob-status" style={{background:sc.c+"22",color:sc.c}}>{sc.l}</span>
                    </div>
                    <span style={{color:"var(--sky)",fontSize:18,marginLeft:6}}>›</span>
                  </div>
                  {g.paxs.length>1&&(
                    <div className="cob-pax">
                      {g.paxs.map((p,j)=>(
                        <div key={j} className="cob-pax-row">
                          <span className="cob-pax-name">{p.nome}</span>
                          <span className="cob-pax-val">{R$(p.falta)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })
          }
        </div>
      )}

      {/* Modal de mensagem */}
      {sel&&(
        <div className="mo" onClick={e=>e.target===e.currentTarget&&setSel(null)}>
          <div className="md ani">
            <div className="mhdl"/>
            <div className="mhd">
              <div>
                <div className="mtit">{sel.resp}</div>
                <div style={{fontSize:11,color:"var(--dim2)",marginTop:2}}>{sel.fone!=="sem-telefone"?sel.fone:"Sem telefone"} · {R$(sel.paxs.reduce((s,p)=>s+p.falta,0))} em aberto</div>
              </div>
              <button className="btn btn-ghost btn-icon" onClick={()=>setSel(null)}>{ICONS.close}</button>
            </div>
            <div className="mbdy" style={{padding:"0 20px 8px"}}>
              <div style={{fontSize:10,fontWeight:600,color:"var(--dim2)",textTransform:"uppercase",letterSpacing:".5px",marginBottom:8}}>Mensagem — edite se necessário</div>
              <textarea className="cob-msg-area" rows={12} value={msgEdit} onChange={e=>setMsgEdit(e.target.value)}/>
            </div>
            <div className="mact" style={{flexWrap:"wrap",gap:8}}>
              <button className="btn btn-ghost btn-full" onClick={()=>{navigator.clipboard.writeText(msgEdit);alert("Mensagem copiada!");}}>
                Copiar mensagem
              </button>
              <button className="btn btn-primary btn-full"
                style={{background:"#25D366",color:"#fff"}}
                onClick={()=>abrirWhatsApp(sel.fone, msgEdit)}>
                {ICONS.whatsapp} Abrir WhatsApp
              </button>
              <button className="btn btn-ghost btn-full" style={{borderColor:"var(--mint)",color:"var(--mint)"}}
                onClick={()=>registrarCobranca(sel)}>
                {ICONS.check} Registrar cobrança feita
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
